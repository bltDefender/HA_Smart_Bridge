[project]
name = "smart-bridge"
version = "0.1.0"
description = "Standalone bridge next to Home Assistant: receive, carry, process."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.22",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "aiohttp>=3.14.5",
    "aiomqtt>=2.5.1",
]

[project.scripts]
bridge = "smart_bridge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema",
    "aiohttp>=3.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_bridge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
